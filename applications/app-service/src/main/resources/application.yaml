server:
  port: "${SERVER_PORT}"

adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    schema: "${DB_SCHEMA}"
    username: "${DB_USER}"
    password: "${DB_PASS}"

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    user: "${DB_USER}"
    password: "${DB_PASS}"
    schemas: "${DB_SCHEMA}"
    default-schema: "${DB_SCHEMA}"
    locations: "classpath:db/migration"

  application:
    name: "CrediYa_Solicitud"

  r2dbc:
    url: "r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}"
    username: "${DB_USER}"
    password: "${DB_PASS}"

  devtools:
    add-properties: false

  h2:
    console:
      enabled: true
      path: "/h2"

  #profiles:
    #include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

  health:
    circuitbreakers:
      enabled: true

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS}"

springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: true

logging:
  level:
    root: "WARN"
    co.com.crediya_solicitud.api.logger: "INFO"

routes:
  solicitud:
    base: "/api/v1/solicitud"

other:
  microservice:
    base-url: "/api/v1/usuarios/document"

adapter:
  sqs:
    region: "us-east-2"
    notifier:
      queue-url: https://sqs.us-east-2.amazonaws.com/657258631869/SQS_Notificaciones
    callback:
      queue-url: https://sqs.us-east-2.amazonaws.com/657258631869/SQS_Callback
      wait-time-seconds: 20
      max-messages: 10


  restconsumer:
    url: "${RESTCONSUMER_URL}"
    timeout: 5000
